<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Звёзды</title>
<style>
  :root {
    --bg: #050510;
    --accent: #7af;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  #hud {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    left: max(8px, env(safe-area-inset-left));
    color: var(--accent);
    font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: rgba(0, 0, 0, 0.35);
    padding: 4px 8px;
    border-radius: 6px;
    pointer-events: none;
    z-index: 10;
    white-space: pre;
    opacity: 0.85;
  }
  @media (prefers-reduced-motion: reduce) {
    #hud { display: none; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="hud" role="status" aria-live="off">FPS: --</div>
<script>
(() => {
  'use strict';

  // ===== Конфигурация =====
  const CONFIG = Object.freeze({
    BG_COLOR: '5, 5, 16',
    TRAIL_ALPHA: 0.35,
    ATTRACT_FORCE: 0.08,
    REPEL_FORCE: 0.35,
    FRICTION: 0.985,
    MAX_SPEED: 8,
    MAX_STARS: 600,
    MIN_STARS: 80,
    STAR_DENSITY: 2200,
    ATTRACT_RADIUS_MIN: 120,
    ATTRACT_RADIUS_RATIO: 0.22,
    REPEL_RADIUS_MULT: 1.5,
    MAX_DPR: 2,
    FIXED_STEP: 16.667,
    MAX_STEPS_PER_FRAME: 3,
    FPS_UPDATE_MS: 500,
    WRAP_MARGIN: 10,
  });

  // ===== Утилиты =====
  const clamp = (v, min, max) => v < min ? min : v > max ? max : v;
  const rand = (min, max) => min + Math.random() * (max - min);

  // Предвычисленная таблица мерцания
  const TWINKLE_TABLE = (() => {
    const t = new Float32Array(256);
    for (let i = 0; i < 256; i++) t[i] = 0.6 + 0.4 * Math.sin((i / 256) * Math.PI * 2);
    return t;
  })();

  // ===== Состояние =====
  const canvas = document.getElementById('stage');
  const hud = document.getElementById('hud');
  const ctx = canvas.getContext('2d', { alpha: false });

  if (!ctx) {
    hud.textContent = 'Canvas недоступен';
    return;
  }

  let W = 0, H = 0, DPR = 1;
  let attractRadius = CONFIG.ATTRACT_RADIUS_MIN;
  let stars = [];
  let rafId = 0;
  let running = true;
  let lastTime = 0;
  let accumulator = 0;

  const pointer = { x: -9999, y: -9999, active: false };

  // FPS
  let fpsFrames = 0;
  let fpsLast = performance.now();

  // ===== Звезда =====
  class Star {
    constructor() { this.reset(true); }
    reset(randomPos = false) {
      this.x = randomPos ? Math.random() * W : 0;
      this.y = randomPos ? Math.random() * H : 0;
      this.vx = rand(-0.4, 0.4);
      this.vy = rand(-0.4, 0.4);
      this.r = rand(0.5, 2.1);
      this.baseAlpha = rand(0.4, 1.0);
      this.phase = (Math.random() * 256) | 0;
      this.speed = (Math.random() * 3 + 1) | 0;
      this.glow = this.r > 1.4;
    }
  }

  // ===== Размер и адаптация =====
  function computeStarCount() {
    const area = W * H;
    return clamp(Math.floor(area / CONFIG.STAR_DENSITY), CONFIG.MIN_STARS, CONFIG.MAX_STARS);
  }

  function syncStarPool(target) {
    if (stars.length < target) {
      for (let i = stars.length; i < target; i++) stars.push(new Star());
    } else if (stars.length > target) {
      stars.length = target;
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, CONFIG.MAX_DPR);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    attractRadius = Math.max(
      CONFIG.ATTRACT_RADIUS_MIN,
      Math.min(W, H) * CONFIG.ATTRACT_RADIUS_RATIO
    );

    syncStarPool(computeStarCount());

    // Переинициализация позиций, чтобы звёзды не «вылезали» за границы
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      if (s.x < -CONFIG.WRAP_MARGIN || s.x > W + CONFIG.WRAP_MARGIN ||
          s.y < -CONFIG.WRAP_MARGIN || s.y > H + CONFIG.WRAP_MARGIN) {
        s.reset(true);
      }
    }

    // Очистка холста после изменения размера
    ctx.fillStyle = `rgb(${CONFIG.BG_COLOR})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ===== Ввод =====
  function getPos(e) {
    const t = e.touches ? e.touches[0] : e;
    if (!t) return null;
    const rect = canvas.getBoundingClientRect();
    return {
      x: clamp(t.clientX - rect.left, 0, W),
      y: clamp(t.clientY - rect.top, 0, H),
    };
  }

  function onStart(e) {
    if (e.cancelable) e.preventDefault();
    const p = getPos(e);
    if (!p) return;
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.active = true;
  }

  function onMove(e) {
    if (!pointer.active) return;
    if (e.cancelable) e.preventDefault();
    const p = getPos(e);
    if (!p) return;
    pointer.x = p.x;
    pointer.y = p.y;
  }

  function onEnd(e) {
    if (e.cancelable) e.preventDefault();
    if (!pointer.active) return;

    const R = attractRadius * CONFIG.REPEL_RADIUS_MULT;
    const R2 = R * R;
    const px = pointer.x, py = pointer.y;

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const dx = s.x - px;
      const dy = s.y - py;
      const d2 = dx * dx + dy * dy;
      if (d2 < R2 && d2 > 1) {
        const dist = Math.sqrt(d2);
        const force = CONFIG.REPEL_FORCE * (1 - dist / R);
        s.vx += (dx / dist) * force;
        s.vy += (dy / dist) * force;
      }
    }

    pointer.active = false;
    pointer.x = -9999;
    pointer.y = -9999;
  }

  // ===== Физика =====
  function physicsStep() {
    const ar = attractRadius;
    const ar2 = ar * ar;
    const px = pointer.x, py = pointer.y;
    const pa = pointer.active;
    const M = CONFIG.WRAP_MARGIN;

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];

      if (pa) {
        const dx = px - s.x;
        const dy = py - s.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < ar2 && d2 > 1) {
          const dist = Math.sqrt(d2);
          const force = CONFIG.ATTRACT_FORCE * (1 - dist / ar);
          s.vx += (dx / dist) * force;
          s.vy += (dy / dist) * force;
        }
      }

      s.x += s.vx;
      s.y += s.vy;
      s.vx *= CONFIG.FRICTION;
      s.vy *= CONFIG.FRICTION;

      const sp2 = s.vx * s.vx + s.vy * s.vy;
      const max2 = CONFIG.MAX_SPEED * CONFIG.MAX_SPEED;
      if (sp2 > max2) {
        const sp = Math.sqrt(sp2);
        const k = CONFIG.MAX_SPEED / sp;
        s.vx *= k;
        s.vy *= k;
      }

      if (s.x < -M) s.x = W + M;
      else if (s.x > W + M) s.x = -M;
      if (s.y < -M) s.y = H + M;
      else if (s.y > H + M) s.y = -M;

      s.phase = (s.phase + s.speed) & 255;
    }
  }

  // ===== Рендер =====
  function render() {
    ctx.fillStyle = `rgba(${CONFIG.BG_COLOR}, ${CONFIG.TRAIL_ALPHA})`;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 1;

    // Обычные звёзды
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      if (s.glow) continue;
      ctx.globalAlpha = s.baseAlpha * TWINKLE_TABLE[s.phase];
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }

    // Светящиеся звёзды
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      if (!s.glow) continue;
      const a = s.baseAlpha * TWINKLE_TABLE[s.phase];
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();

      ctx.globalAlpha = a * 0.15;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 2.5, 0, 6.2832);
      ctx.fill();
    }

    ctx.globalAlpha = 1;

    if (pointer.active) {
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, attractRadius, 0, 6.2832);
      ctx.strokeStyle = 'rgba(120, 160, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // ===== FPS =====
  function updateFPS(now) {
    fpsFrames++;
    const elapsed = now - fpsLast;
    if (elapsed >= CONFIG.FPS_UPDATE_MS) {
      const fps = Math.round((fpsFrames * 1000) / elapsed);
      hud.textContent = `FPS: ${fps}  \u2605 ${stars.length}`;
      fpsFrames = 0;
      fpsLast = now;
    }
  }

  // ===== Главный цикл =====
  function loop(now) {
    if (!running) return;

    const dt = Math.min(now - lastTime, 100);
    lastTime = now;
    accumulator += dt;

    let steps = 0;
    while (accumulator >= CONFIG.FIXED_STEP && steps < CONFIG.MAX_STEPS_PER_FRAME) {
      physicsStep();
      accumulator -= CONFIG.FIXED_STEP;
      steps++;
    }
    if (steps === CONFIG.MAX_STEPS_PER_FRAME) accumulator = 0;

    render();
    updateFPS(now);
    rafId = requestAnimationFrame(loop);
  }

  // ===== Жизненный цикл =====
  function start() {
    if (running) return;
    running = true;
    lastTime = performance.now();
    accumulator = 0;
    rafId = requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  function onVisibilityChange() {
    if (document.hidden) stop();
    else start();
  }

  // ===== Слушатели =====
  const passiveOpt = { passive: true };
  const activeOpt = { passive: false };

  canvas.addEventListener('touchstart', onStart, activeOpt);
  canvas.addEventListener('touchmove', onMove, activeOpt);
  canvas.addEventListener('touchend', onEnd, activeOpt);
  canvas.addEventListener('touchcancel', onEnd, activeOpt);

  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('mousemove', (e) => { if (pointer.active) onMove(e); });
  canvas.addEventListener('mouseup', onEnd);
  canvas.addEventListener('mouseleave', (e) => { if (pointer.active) onEnd(e); });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('resize', resize, passiveOpt);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200), passiveOpt);
  document.addEventListener('visibilitychange', onVisibilityChange, passiveOpt);

  // Пауза при потере фокуса (для ПК)
  window.addEventListener('blur', stop, passiveOpt);
  window.addEventListener('focus', start, passiveOpt);

  // ===== Инициализация =====
  resize();
  lastTime = performance.now();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
